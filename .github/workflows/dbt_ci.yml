name: dbt CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt_test_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install "dbt-core~=1.8.0" "dbt-snowflake~=1.8.0"

      - name: Verify dbt Project Parsing & Syntax
        env:
          DBT_PROFILES_DIR: ./
        run: |
          dbt parse
